# Requests for any other host name are dropped: this blocks DNS-rebinding attacks, where a hostile
# page points its own domain at 127.0.0.1 to read the local app.
server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    server_name localhost 127.0.0.1;
    root /usr/share/nginx/html;
    server_tokens off;

    # Slightly above the API's 5 MB limit so the API, not nginx, answers with a clear 413.
    client_max_body_size 6m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:" always;

    # Errors nginx produces itself are JSON problem details too, like the API's.
    error_page 413 /errors/413.json;
    error_page 502 503 504 /errors/unavailable.json;
    location ^~ /errors/ {
        internal;
        default_type application/problem+json;
        location = /errors/413.json { return 413 '{"title":"Payload Too Large","status":413,"detail":"Files are limited to 5 MB"}'; }
        location = /errors/unavailable.json { return 503 '{"title":"Service Unavailable","status":503,"detail":"The API is not responding; try again shortly"}'; }
    }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
        proxy_intercept_errors off;
    }

    location / {
        try_files $uri /index.html;
    }
}
