name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # validate: Spotless format check. compile: javac -Xlint:all -Werror (no raw types, no
      # unchecked casts). test: unit tests, backtest regression, Testcontainers end-to-end tests.
      - name: Format, compile with all lint warnings as errors, test
        run: ./mvnw -B verify
      - name: Backtest smoke run (dev seeds 1-4)
        run: ./mvnw -B -q exec:java -Dexec.args="--split smoke --paths 100 --out target/eval"
      - uses: actions/upload-artifact@v4
        with:
          name: backtest-smoke
          path: backend/target/eval

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: docker compose build
